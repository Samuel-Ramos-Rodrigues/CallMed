name: CallMed - AAB Google Play

on:
  workflow_dispatch:

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 16 / API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validar secrets de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.CALLMED_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CALLMED_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CALLMED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALLMED_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Secret CALLMED_UPLOAD_KEYSTORE_BASE64 ausente" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Secret CALLMED_KEYSTORE_PASSWORD ausente" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret CALLMED_KEY_ALIAS ausente" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret CALLMED_KEY_PASSWORD ausente" && exit 1)

      - name: Restaurar chave de upload
        env:
          KEYSTORE_B64: ${{ secrets.CALLMED_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > CallMedTWA/callmed-upload.jks

      - name: Gerar AAB assinado
        working-directory: CallMedTWA
        env:
          CALLMED_KEYSTORE_FILE: callmed-upload.jks
          CALLMED_KEYSTORE_PASSWORD: ${{ secrets.CALLMED_KEYSTORE_PASSWORD }}
          CALLMED_KEY_ALIAS: ${{ secrets.CALLMED_KEY_ALIAS }}
          CALLMED_KEY_PASSWORD: ${{ secrets.CALLMED_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bundleRelease

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: CallMed-v21.3-Play-AAB
          path: CallMedTWA/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Limpar chave do runner
        if: always()
        run: rm -f CallMedTWA/callmed-upload.jks
