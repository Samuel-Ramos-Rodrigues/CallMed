name: CallMed quality
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: callmed
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: callmed_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U callmed" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      CALLMED_TEST_DB: Host=127.0.0.1;Port=5432;Database=callmed_test_ci;Username=callmed;Password=test-only
    steps:
      - uses: actions/checkout@v4
      - name: Validar integridade do CSS modular
        run: node tests/css-integrity.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build CallMed.sln -c Release -m:1
      - name: Domain, identity and audit regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet tests/CallMed.Checks/bin/Release/net10.0/CallMed.Checks.dll
          for suite in conta mobile apk salas piloto operacao psicologia turn teleconsulta jornada amplo audit-fixes architecture; do
            dotnet tests/CallMed.Checks/bin/Release/net10.0/CallMed.Checks.dll --"$suite"
          done
      - name: PostgreSQL migration and concurrency
        shell: bash
        run: |
          set -euo pipefail
          for suite in salas-pg piloto-pg psicologia-pg jornada-pg amplo-pg audit-pg; do
            dotnet tests/CallMed.Checks/bin/Release/net10.0/CallMed.Checks.dll --"$suite"
          done
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/check-css.py
      - run: python3 scripts/auditar-views-callmed.py
      - name: NuGet vulnerability gate
        shell: bash
        run: |
          dotnet list src/CallMed.Web/CallMed.Web.csproj package --include-transitive --vulnerable --format json > vulnerabilities.json
          python3 scripts/check-vulnerabilities.py vulnerabilities.json
      - run: dotnet publish src/CallMed.Web/CallMed.Web.csproj -c Release --no-restore -o artifacts/web
      - run: dotnet publish src/CallMed.Worker/CallMed.Worker.csproj -c Release --no-restore -o artifacts/worker
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [design, avatar-consultas, amplo, premium, refinamento, salas, psicologia, piloto]
    env:
      CALLMED_CHECKS_CONFIGURATION: Release
      CALLMED_BROWSER_OUTPUT: artifacts/browser-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: dotnet build CallMed.sln -c Release -m:1
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: node tests/browser/check-${{ matrix.suite }}.cjs
      - name: Capture visual audit screenshots (synthetic fixtures only)
        if: ${{ always() && matrix.suite == 'design' }}
        uses: actions/upload-artifact@v4
        with:
          name: callmed-v40-visual-review
          path: artifacts/browser-design
          if-no-files-found: warn
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mobile/android/gradlew
      - run: mobile/android/gradlew -p mobile/android --no-daemon testDebugUnitTest assembleDebug
  certificate-generator:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Certificate creation and import (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/check-certificado.ps1
      - name: Certificate creation and import (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/check-certificado.ps1
